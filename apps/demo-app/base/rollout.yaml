apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: raghad37/ci-cd-lab:latest
          ports:
            - containerPort: 5000
          env:
            - name: ENVIRONMENT
              value: "base"

  strategy:
    canary:
      canaryService: demo-app-canary
      stableService: demo-app

      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: demo-app-analysis

        - setWeight: 50
        - analysis:
            templates:
              - templateName: demo-app-analysis

        - setWeight: 100

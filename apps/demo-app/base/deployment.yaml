apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: raghad37/ci-cd-lab:latest
          ports:
            - containerPort: 5000
          env:
            - name: ENVIRONMENT
              value: "base"

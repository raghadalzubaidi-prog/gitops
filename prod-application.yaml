apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/raghadalzubaidi-prog/gitops.git
    targetRevision: main
    path: apps/demo-app/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
